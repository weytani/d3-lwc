<template>
  <div class="slds-card">
    <!-- Loading State -->
    <template lwc:if={isLoading}>
      <div class="slds-align_absolute-center" style="height: 200px">
        <lightning-spinner
          alternative-text="Loading chart..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Error State -->
    <template lwc:elseif={hasError}>
      <div
        class="slds-align_absolute-center slds-text-color_error"
        style="height: 200px; padding: 1rem"
      >
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:error"
            alternative-text="Error"
            size="large"
            variant="error"
          ></lightning-icon>
          <p class="slds-m-top_small">{error}</p>
        </div>
      </div>
    </template>

    <!-- Chart Container (has data) -->
    <template lwc:elseif={hasData}>
      <div class="chart-container" lwc:dom="manual" style={containerStyle}></div>

      <!-- Statistics Summary -->
      <template lwc:if={showStatistics}>
        <div
          class="statistics-info slds-p-horizontal_medium slds-p-vertical_small slds-border_top"
        >
          <div class="slds-grid slds-wrap slds-gutters_x-small">
            <div class="slds-col slds-size_1-of-4">
              <span class="stat-label">Mean:</span>
              <span class="stat-value">{meanDisplay}</span>
            </div>
            <div class="slds-col slds-size_1-of-4">
              <span class="stat-label">Median:</span>
              <span class="stat-value">{medianDisplay}</span>
            </div>
            <div class="slds-col slds-size_1-of-4">
              <span class="stat-label">Std Dev:</span>
              <span class="stat-value">{stdDevDisplay}</span>
            </div>
            <div class="slds-col slds-size_1-of-4">
              <span class="stat-label">Count:</span>
              <span class="stat-value">{countDisplay}</span>
            </div>
          </div>
        </div>
      </template>
    </template>

    <!-- No Data State -->
    <template lwc:else>
      <div
        class="slds-align_absolute-center slds-text-color_weak"
        style="height: 200px"
      >
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:chart"
            alternative-text="No data"
            size="large"
          ></lightning-icon>
          <p class="slds-m-top_small">No data available</p>
        </div>
      </div>
    </template>
  </div>
</template>
