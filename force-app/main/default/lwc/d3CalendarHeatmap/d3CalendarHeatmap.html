<template>
  <div class="slds-card">
    <!-- Loading State -->
    <template lwc:if={isLoading}>
      <div class="slds-align_absolute-center" style="height: 200px">
        <lightning-spinner
          alternative-text="Loading chart..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Error State -->
    <template lwc:elseif={hasError}>
      <div
        class="slds-align_absolute-center slds-text-color_error"
        style="height: 200px; padding: 1rem"
      >
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:error"
            alternative-text="Error"
            size="large"
            variant="error"
          ></lightning-icon>
          <p class="slds-m-top_small">{error}</p>
        </div>
      </div>
    </template>

    <!-- Chart Container (has data) -->
    <template lwc:elseif={hasData}>
      <!-- Year Navigation -->
      <div class="slds-grid slds-grid_align-center slds-m-bottom_x-small">
        <button class="slds-button slds-button_icon" onclick={handlePrevYear}>
          <lightning-icon
            icon-name="utility:chevronleft"
            size="x-small"
          ></lightning-icon>
        </button>
        <span class="slds-text-heading_small slds-m-horizontal_medium"
          >{displayYear}</span
        >
        <button class="slds-button slds-button_icon" onclick={handleNextYear}>
          <lightning-icon
            icon-name="utility:chevronright"
            size="x-small"
          ></lightning-icon>
        </button>
      </div>

      <div class="chart-container" lwc:dom="manual" style={containerStyle}></div>
    </template>

    <!-- No Data State -->
    <template lwc:else>
      <div
        class="slds-align_absolute-center slds-text-color_weak"
        style="height: 200px"
      >
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:chart"
            alternative-text="No data"
            size="large"
          ></lightning-icon>
          <p class="slds-m-top_small">No data available</p>
        </div>
      </div>
    </template>
  </div>
</template>
