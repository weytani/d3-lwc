<template>
  <div class="chart-container slds-is-relative" lwc:ref="container">
    <!-- Loading State -->
    <div class="chart-loading" if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading chart"
        size="medium"
      ></lightning-spinner>
    </div>

    <!-- Error State -->
    <div
      class="chart-error slds-text-color_error slds-p-around_medium"
      if:true={error}
    >
      <lightning-icon
        icon-name="utility:error"
        size="small"
        variant="error"
        class="slds-m-right_x-small"
      ></lightning-icon>
      {error}
    </div>

    <!-- No Data State -->
    <div class="chart-no-data slds-text-color_weak" if:true={showNoData}>
      <lightning-icon
        icon-name="utility:chart"
        alternative-text="No data"
        size="small"
        class="slds-m-right_x-small"
      ></lightning-icon>
      No data available
    </div>

    <!-- Chart SVG -->
    <svg lwc:ref="svg" class="chart-svg" if:true={showChart}></svg>
  </div>
</template>
